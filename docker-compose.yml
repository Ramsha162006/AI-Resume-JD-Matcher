services:
  mysqldb:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: tanzeel
      MYSQL_DATABASE: ats_scorer
    ports:
      - '3308:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always
    ports:
      - '6380:6379'

  web-app:
    depends_on:
      - mysqldb
      - redis
    build: .
    ports:
      - '3000:3000'
    environment:
      - MYSQL_HOST=mysqldb
      - MYSQL_USER=root
      - MYSQL_PASSWORD=tanzeel
      - MYSQL_DATABASE=ats_scorer
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}

volumes:
  mysql_data:
